<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-Powered College FAQ Assistant | RAG System</title>
  <meta name="description" content="Intelligent College FAQ Chatbot powered by LangChain, FastAPI, FAISS, and Retrieval-Augmented Generation (RAG).">
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <!-- React & Babel Standalone for Seamless Zero-Build Deployment -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-surface: #111827;
      --bg-surface-elevated: #1f2937;
      --bg-card: rgba(31, 41, 55, 0.7);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-highlight: rgba(99, 102, 241, 0.3);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-glow: rgba(99, 102, 241, 0.25);
      --accent: #06b6d4;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-faint: #6b7280;
      --success: #10b981;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 9999px;
    }

    #root {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* Layout */
    .app-container {
      display: flex;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.07) 0%, transparent 40%),
                  radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.06) 0%, transparent 40%);
    }

    /* Sidebar */
    .sidebar {
      width: 320px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .college-badge {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 14px var(--primary-glow);
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.2px;
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--accent);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .online-indicator {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-faint);
      margin-bottom: 10px;
    }

    /* Knowledge Card */
    .kb-card {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
    }

    .kb-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
    }
    .kb-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .doc-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chunk-badge {
      background: rgba(99, 102, 241, 0.15);
      color: var(--primary);
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }

    /* FAQ Quick Prompts */
    .faq-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .faq-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12.5px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      line-height: 1.35;
    }

    .faq-btn:hover {
      background: rgba(99, 102, 241, 0.1);
      border-color: var(--border-highlight);
      color: #fff;
      transform: translateX(3px);
    }

    /* Sidebar Footer */
    .sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .reset-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .reset-btn:hover {
      background: rgba(239, 68, 68, 0.1);
      border-color: #ef4444;
      color: #f87171;
    }

    /* Main Chat Section */
    .main-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }

    /* Chat Top Bar */
    .chat-header {
      height: 68px;
      border-bottom: 1px solid var(--border-color);
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(12px);
      background: rgba(17, 24, 39, 0.7);
    }

    .chat-title-group h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 600;
      color: #fff;
    }

    .chat-title-group p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .stats-badge-group {
      display: flex;
      gap: 10px;
    }

    .stat-pill {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
    }

    .stat-pill strong {
      color: var(--accent);
    }

    /* Messages Area */
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* Welcome Hero */
    .welcome-hero {
      margin: auto;
      max-width: 640px;
      text-align: center;
      padding: 40px 20px;
    }

    .hero-icon {
      font-size: 48px;
      margin-bottom: 16px;
      display: inline-block;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .welcome-hero h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #fff 40%, var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .welcome-hero p {
      color: var(--text-muted);
      font-size: 14.5px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      text-align: left;
    }

    .hero-card {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-color);
      padding: 14px 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .hero-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px var(--primary-glow);
    }

    .hero-card strong {
      display: block;
      font-size: 13.5px;
      color: #fff;
      margin-bottom: 4px;
    }

    .hero-card span {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Message Bubbles */
    .message-row {
      display: flex;
      gap: 14px;
      max-width: 820px;
      width: 100%;
    }

    .message-row.user {
      margin-left: auto;
      flex-direction: row-reverse;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .avatar.assistant {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      box-shadow: 0 2px 10px var(--primary-glow);
    }

    .avatar.user {
      background: #374151;
      color: #e5e7eb;
    }

    .message-content {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: calc(100% - 50px);
    }

    .bubble {
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
    }

    .message-row.user .bubble {
      background: var(--primary);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message-row.assistant .bubble {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-bottom-left-radius: 4px;
    }

    /* Markdown Styling in Responses */
    .bubble h3 {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 8px;
    }
    .bubble ul {
      margin-left: 18px;
      margin-bottom: 10px;
    }
    .bubble li {
      margin-bottom: 4px;
    }
    .bubble strong {
      color: #fff;
    }
    .bubble em {
      color: var(--text-muted);
      font-size: 12px;
      display: block;
      margin-top: 8px;
    }

    /* Meta bar below assistant message */
    .message-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 11.5px;
      color: var(--text-faint);
      padding-left: 4px;
    }

    /* Retrieved Sources Box */
    .sources-box {
      margin-top: 6px;
      border: 1px solid var(--border-color);
      background: rgba(0, 0, 0, 0.25);
      border-radius: 10px;
      overflow: hidden;
    }

    .sources-toggle {
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.02);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      color: var(--accent);
      user-select: none;
    }
    .sources-toggle:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .sources-content {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid var(--border-color);
    }

    .source-item {
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 6px;
      font-size: 12px;
    }

    .source-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-weight: 600;
      color: #e5e7eb;
    }

    .score-badge {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10.5px;
    }

    .source-snippet {
      color: var(--text-muted);
      font-size: 11.5px;
      line-height: 1.45;
    }

    /* Follow up Suggestion Chips */
    .suggestions-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    .suggestion-chip {
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #c7d2fe;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .suggestion-chip:hover {
      background: var(--primary);
      color: #fff;
    }

    /* Typing Animation */
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 12px 18px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: fit-content;
    }
    .typing-dot {
      width: 7px;
      height: 7px;
      background: var(--text-faint);
      border-radius: 50%;
      animation: pulse 1.4s infinite ease-in-out both;
    }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Input Footer */
    .chat-input-area {
      padding: 18px 28px 24px 28px;
      border-top: 1px solid var(--border-color);
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(12px);
    }

    .input-wrapper {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-wrapper:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .chat-textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      resize: none;
      max-height: 120px;
      line-height: 1.5;
    }

    .chat-textarea::placeholder {
      color: var(--text-faint);
    }

    .send-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .send-btn:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: scale(1.05);
    }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .input-hints {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-faint);
      padding: 0 4px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [messages, setMessages] = useState([]);
      const [inputValue, setInputValue] = useState("");
      const [loading, setLoading] = useState(false);
      const [documents, setDocuments] = useState([]);
      const [faqs, setFaqs] = useState([]);
      const [expandedSources, setExpandedSources] = useState({});
      const [stats, setStats] = useState({ indexed_chunks: 0, total_docs: 0 });
      const [sessionId] = useState(() => "session_" + Math.random().toString(36).substring(2, 9));
      const messagesEndRef = useRef(null);

      const scrollToBottom = () => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      };

      useEffect(() => {
        scrollToBottom();
      }, [messages, loading]);

      // Load initial documents & FAQs from FastAPI
      useEffect(() => {
        fetch("/api/documents")
          .then(res => res.json())
          .then(data => {
            setDocuments(data.documents || []);
            setStats({
              indexed_chunks: data.total_chunks,
              total_docs: data.total_documents
            });
          })
          .catch(err => console.error("Error loading documents:", err));

        fetch("/api/faqs")
          .then(res => res.json())
          .then(data => setFaqs(data || []))
          .catch(err => console.error("Error loading FAQs:", err));
      }, []);

      const sendMessage = async (textToSend) => {
        const queryText = (textToSend || inputValue).trim();
        if (!queryText || loading) return;

        // Append User Message
        const userMsg = {
          id: Date.now(),
          role: "user",
          text: queryText,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };
        setMessages(prev => [...prev, userMsg]);
        setInputValue("");
        setLoading(true);

        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: queryText, session_id: sessionId })
          });

          if (!response.ok) throw new Error("Server error responding to query");
          const data = await response.json();

          const assistantMsg = {
            id: Date.now() + 1,
            role: "assistant",
            text: data.answer,
            sources: data.sources || [],
            confidence: data.confidence_score,
            latency: data.latency_ms,
            suggestions: data.suggestions || [],
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          };
          setMessages(prev => [...prev, assistantMsg]);
        } catch (error) {
          const errorMsg = {
            id: Date.now() + 1,
            role: "assistant",
            text: "⚠️ Sorry, an error occurred while connecting to the RAG backend. Please ensure the FastAPI server is running.",
            sources: [],
            confidence: 0,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          };
          setMessages(prev => [...prev, errorMsg]);
        } finally {
          setLoading(false);
        }
      };

      const handleKeyDown = (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      };

      const toggleSources = (msgId) => {
        setExpandedSources(prev => ({ ...prev, [msgId]: !prev[msgId] }));
      };

      const handleClearChat = async () => {
        await fetch("/api/clear-session", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId })
        });
        setMessages([]);
      };

      // Formatted text helper (renders markdown headings and bullets)
      const renderFormattedText = (rawText) => {
        const lines = rawText.split("\n");
        return lines.map((line, idx) => {
          if (line.startsWith("### ")) {
            return <h3 key={idx}>{line.replace("### ", "")}</h3>;
          }
          if (line.startsWith("- ")) {
            const formatted = line.replace("- ", "").replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            return <li key={idx} dangerouslySetInnerHTML={{ __html: formatted }} />;
          }
          if (line.trim().startsWith("*(")) {
            return <em key={idx}>{line}</em>;
          }
          if (line.trim() === "") {
            return <br key={idx} />;
          }
          const formatted = line.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
          return <p key={idx} style={{ marginBottom: "6px" }} dangerouslySetInnerHTML={{ __html: formatted }} />;
        });
      };

      return (
        <div className="app-container">
          {/* Left Sidebar */}
          <aside className="sidebar">
            <div className="sidebar-header">
              <div className="college-badge">🏛️</div>
              <div>
                <div className="brand-title">College AI Assistant</div>
                <div className="brand-subtitle">
                  <span className="online-indicator"></span> RAG Knowledge Active
                </div>
              </div>
            </div>

            <div className="sidebar-scroll">
              {/* Knowledge Base Status Card */}
              <div>
                <div className="section-label">Indexed Documents ({documents.length})</div>
                <div className="kb-card">
                  {documents.map((doc, idx) => (
                    <div key={idx} className="kb-item">
                      <div className="doc-pill" title={doc.filename}>
                        <span>📄</span>
                        <span>{doc.filename}</span>
                      </div>
                      <span className="chunk-badge">{doc.chunks_indexed} chunks</span>
                    </div>
                  ))}
                </div>
              </div>

              {/* Popular FAQs */}
              <div>
                <div className="section-label">Frequently Asked Questions</div>
                <div className="faq-list">
                  {faqs.map((faq, idx) => (
                    <button
                      key={idx}
                      className="faq-btn"
                      onClick={() => sendMessage(faq.question)}
                      disabled={loading}
                    >
                      <span>💬</span>
                      <span>{faq.question}</span>
                    </button>
                  ))}
                </div>
              </div>
            </div>

            <div className="sidebar-footer">
              <button className="reset-btn" onClick={handleClearChat}>
                <span>🗑️</span>
                <span>Reset Chat</span>
              </button>
              <span style={{ fontSize: "11px", color: "var(--text-faint)" }}>
                FAISS Vector Engine
              </span>
            </div>
          </aside>

          {/* Main Chat Area */}
          <main className="main-chat">
            {/* Header */}
            <header className="chat-header">
              <div className="chat-title-group">
                <h2>Campus Academic & Notices Bot</h2>
                <p>Retrieval-Augmented Generation over official university rules & regulations</p>
              </div>

              <div className="stats-badge-group">
                <div className="stat-pill">
                  <span>Vectors:</span>
                  <strong>{stats.indexed_chunks} Chunks</strong>
                </div>
                <div className="stat-pill">
                  <span>Engine:</span>
                  <strong>FAISS + MiniLM</strong>
                </div>
              </div>
            </header>

            {/* Messages Scroll Area */}
            <div className="messages-container">
              {messages.length === 0 ? (
                <div className="welcome-hero">
                  <div className="hero-icon">🎓</div>
                  <h1>How can I assist you today?</h1>
                  <p>
                    I am trained on official college notices, academic regulations, examination schedules, 
                    fee structures, and hostel policies. Ask any query below.
                  </p>
                  <div className="hero-grid">
                    <div className="hero-card" onClick={() => sendMessage("What is the minimum attendance required for semester exams?")}>
                      <strong>📋 Attendance Policy</strong>
                      <span>Check condonation limits & detention rules</span>
                    </div>
                    <div className="hero-card" onClick={() => sendMessage("When is the tuition fee payment deadline for odd semester?")}>
                      <strong>💳 Fee Deadlines & Fines</strong>
                      <span>Semester fee schedules & late penalties</span>
                    </div>
                    <div className="hero-card" onClick={() => sendMessage("What are the eligibility criteria for campus placements?")}>
                      <strong>💼 Placement Guidelines</strong>
                      <span>CGPA requirements & dream offer policies</span>
                    </div>
                    <div className="hero-card" onClick={() => sendMessage("What are the hostel curfew and mess timings?")}>
                      <strong>🏠 Hostel & Campus Life</strong>
                      <span>Library hours, meal times & gate timings</span>
                    </div>
                  </div>
                </div>
              ) : (
                messages.map((msg) => (
                  <div key={msg.id} className={`message-row ${msg.role}`}>
                    <div className={`avatar ${msg.role}`}>
                      {msg.role === "assistant" ? "🤖" : "👤"}
                    </div>
                    <div className="message-content">
                      <div className="bubble">
                        {renderFormattedText(msg.text)}
                      </div>

                      {/* Assistant Meta & Sources */}
                      {msg.role === "assistant" && (
                        <>
                          <div className="message-meta">
                            <span>⏱️ {msg.latency ? `${msg.latency} ms` : "Fast"}</span>
                            <span>🎯 {msg.confidence ? `${msg.confidence}% Match` : "Verified"}</span>
                            <span>{msg.timestamp}</span>
                          </div>

                          {/* Retrieved Knowledge Sources Accordion */}
                          {msg.sources && msg.sources.length > 0 && (
                            <div className="sources-box">
                              <div
                                className="sources-toggle"
                                onClick={() => toggleSources(msg.id)}
                              >
                                <span>📚 {msg.sources.length} Retrieved Source Passages</span>
                                <span>{expandedSources[msg.id] ? "▲ Hide" : "▼ View"}</span>
                              </div>
                              {expandedSources[msg.id] && (
                                <div className="sources-content">
                                  {msg.sources.map((src, sIdx) => (
                                    <div key={sIdx} className="source-item">
                                      <div className="source-header">
                                        <span>📄 {src.source}</span>
                                        <span className="score-badge">{src.score}% Match</span>
                                      </div>
                                      <div className="source-snippet">
                                        "{src.text.slice(0, 180)}..."
                                      </div>
                                    </div>
                                  ))}
                                </div>
                              )}
                            </div>
                          )}

                          {/* Follow-up suggestions */}
                          {msg.suggestions && msg.suggestions.length > 0 && (
                            <div className="suggestions-container">
                              {msg.suggestions.map((sug, sugIdx) => (
                                <button
                                  key={sugIdx}
                                  className="suggestion-chip"
                                  onClick={() => sendMessage(sug)}
                                >
                                  {sug}
                                </button>
                              ))}
                            </div>
                          )}
                        </>
                      )}
                    </div>
                  </div>
                ))
              )}

              {loading && (
                <div className="message-row assistant">
                  <div className="avatar assistant">🤖</div>
                  <div className="typing-indicator">
                    <div className="typing-dot"></div>
                    <div className="typing-dot"></div>
                    <div className="typing-dot"></div>
                  </div>
                </div>
              )}
              <div ref={messagesEndRef} />
            </div>

            {/* Input Form */}
            <div className="chat-input-area">
              <div className="input-wrapper">
                <textarea
                  className="chat-textarea"
                  placeholder="Ask any question about academic rules, fees, exams, hostel..."
                  rows="1"
                  value={inputValue}
                  onChange={(e) => setInputValue(e.target.value)}
                  onKeyDown={handleKeyDown}
                />
                <button
                  className="send-btn"
                  onClick={() => sendMessage()}
                  disabled={!inputValue.trim() || loading}
                  title="Send Question"
                >
                  ➤
                </button>
              </div>
              <div className="input-hints">
                <span>Press <strong>Enter</strong> to send, <strong>Shift + Enter</strong> for new line</span>
                <span>Powered by LangChain & FAISS RAG Pipeline</span>
              </div>
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
